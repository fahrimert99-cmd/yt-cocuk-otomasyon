name: Videoyu ElevenLabs ile Yeniden Uret

# Tek seferlik / elle: bir Shorts videosunu ElevenLabs sesiyle (ses cizirtisi
# duzeltmeli) yeniden uretir. YAYIN_ZAMANI bos birakilirsa eski videonun
# gizliligi/zamanlanmis yayin saati OTOMATIK korunur. Eskisini siler ve
# durum.json'daki bekleyen_yorum/yapilan_id referanslarini yeni id'ye tasir.
# Gunluk cron'a (otomasyon.py) dokunmaz.
# Günlük iki slot dışında video yüklenmemesi için devre dışı.
on: {}

permissions:
  contents: write

jobs:
  yeniden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: ElevenLabs ile yeniden uret + eskiyi sil
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BASLIK: ${{ github.event.inputs.baslik }}
          ESKI_VIDEO_ID: ${{ github.event.inputs.eski_video_id }}
          YAYIN_ZAMANI: ${{ github.event.inputs.yayin_zamani }}
        run: python3 yeniden_uret.py
      - name: durum.json kaydini isle
        if: always()
        run: |
          git config user.name "yeniden-bot"
          git config user.email "yeniden-bot@users.noreply.github.com"
          git add durum.json || true
          git commit -m "yeniden: shorts id guncellendi (temiz ses)" || echo "degisiklik yok"
          git pull --rebase origin main || true
          git push || echo "push atlandi"
