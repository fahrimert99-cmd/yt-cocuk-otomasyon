name: Uzun Videoyu Temiz Sesle Yeniden Uret

# Tek seferlik / elle: PLANLI (private + publishAt) bir UZUN gizem videosunu,
# ses cizirtisi duzeltmesiyle yeniden uretir; eski basligi/aciklamayi/etiketi ve
# zamanlanmis yayin saatini KORUR, eskisini siler. Gunluk uzun cron'a dokunmaz.
on:
  workflow_dispatch:
    inputs:
      konu:
        description: "uzun_konular.json'daki birebir konu basligi"
        required: true
        default: "OKYANUSUN HARİTALANMAMIŞ DERİNLİKLERİNDE NE VAR?"
      eski_video_id:
        description: "Degistirilecek (silinecek) mevcut YouTube video id"
        required: true
        default: "iTzf7lDzQIE"

permissions:
  contents: write

jobs:
  yeniden_uzun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Uzun videoyu temiz sesle yeniden uret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_KEY_UZUN: ${{ secrets.GEMINI_KEY_UZUN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          KONU: ${{ github.event.inputs.konu }}
          ESKI_VIDEO_ID: ${{ github.event.inputs.eski_video_id }}
        run: python3 yeniden_uzun.py
      - name: Durum kaydini isle (uzun_durum.json)
        if: always()
        run: |
          git config user.name "yeniden-bot"
          git config user.email "yeniden-bot@users.noreply.github.com"
          git add uzun_durum.json || true
          git commit -m "yeniden: uzun video id guncellendi (temiz ses)" || echo "degisiklik yok"
          git pull --rebase origin main || true
          git push || echo "push atlandi"
