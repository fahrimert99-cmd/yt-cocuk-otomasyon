name: Manus Arastirma

# KREDI KURGUSU (Manus ucretsiz plan):
#   · Her gun 300 kredi yenilenir, UTC gece yarisi SIFIRLANIR ve devredilmez
#     -> kullanilmayan kredi YANAR, bu yuzden duzenli/kucuk gorevler mantikli.
#   · Tuketim sirasi gunluk -> aylik -> kalici bakiye; gunde 300'u asmayan bir
#     gorev hesaptaki kalici 1100 krediye HIC dokunmaz.
#   · Yenilenen kredilerin AYLIK tavani 1500'dur (asil sinir) -> ayda ~10-12
#     lite gorev. Takvim buna gore 3 GUNDE BIR senaryo + ayda 1 strateji.
#   · Ucretsiz planda yalnizca 'lite' (Manus 1.6 Lite) calisir.
on:
  schedule:
    - cron: "0 4 1 * *"      # ayin 1'i 04:00 UTC — aylik strateji raporu
    - cron: "0 5 */3 * *"    # 3 gunde bir 05:00 UTC — kaynakli senaryo besleme
  workflow_dispatch:
    inputs:
      mod:
        description: "Is kolu"
        required: true
        default: "ping"
        type: choice
        options: [ping, senaryo, strateji, rakip]
      profil:
        description: "Ajan profili (ucretsiz planda yalnizca lite calisir)"
        required: false
        default: "lite"
        type: choice
        options: [lite, standart, max]
      sayi:
        description: "senaryo modunda uretilecek adet (1-8)"
        required: false
        default: "3"
      rezerv:
        description: "Gunluk/aylik kredi bittiyse kalici bakiyeden (rezerv) harca"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: kisa-video          # senaryolar.json yazimini otomasyon ile serialize et
  cancel-in-progress: false

jobs:
  manus:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # Manus gorevleri uzun surebilir (arastirma + rapor)
    steps:
      - uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Manus gorevi
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          # Zamanlanmis kosuda mod cron'dan belirlenir; elle kosuda girdiden.
          MOD: ${{ github.event.inputs.mod || (github.event.schedule == '0 4 1 * *' && 'strateji' || 'senaryo') }}
          PROFIL: ${{ github.event.inputs.profil || 'lite' }}
          SAYI: ${{ github.event.inputs.sayi || '3' }}
          # Rezerv (kalici 1100 kredi) yalnizca elle ve bilerek acilir.
          MANUS_REZERV: ${{ github.event.inputs.rezerv == 'true' && '1' || '0' }}
        run: python3 manus_besle.py
      - name: Ciktilari commit et
        if: always()
        run: |
          git config user.name "manus-bot"
          git config user.email "manus-bot@users.noreply.github.com"
          # Var olan dosyalari TEK TEK ekle: 'git add a b c' listedeki bir dosya
          # yoksa tamamen basarisiz olur ve HICBIR SEYI stage etmez (ilk ping
          # kosusunda kredi defteri bu yuzden commit'lenmeden kaldi).
          for f in senaryolar.json manus_durum.json manus_rapor.md \
                   manus_strateji.md manus_rakip.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "manus: otomatik kosu ciktisi" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz"; sleep $((2 ** i))
          done
          echo "push atlandi"; exit 0
