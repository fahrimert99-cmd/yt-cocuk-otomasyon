name: Manus Arastirma (Elle)

# KREDI KORUMASI: Bu is akisi BILEREK cron'suzdur — yalnizca elle calisir.
# Manus bir ajan servisidir ve gorev basina ~100-500 kredi harcar; gunluk
# uretim hatti (otomasyon/uzun/haber) Manus'a BAGLANMAMISTIR ve ucretsiz
# saglayicilarla calismaya devam eder.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "Is kolu"
        required: true
        default: "ping"
        type: choice
        options: [ping, senaryo, strateji, rakip]
      profil:
        description: "Ajan profili (lite ~100, standart ~250, max ~500 kredi)"
        required: false
        default: "lite"
        type: choice
        options: [lite, standart, max]
      sayi:
        description: "senaryo modunda uretilecek adet (1-8)"
        required: false
        default: "5"
      butce:
        description: "Toplam kredi butcesi (bos = manus_durum.json'daki deger)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kisa-video          # senaryolar.json yazimini otomasyon ile serialize et
  cancel-in-progress: false

jobs:
  manus:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # Manus gorevleri uzun surebilir (arastirma + rapor)
    steps:
      - uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Manus gorevi
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MANUS_BUTCE: ${{ github.event.inputs.butce }}
          MOD: ${{ github.event.inputs.mod }}
          PROFIL: ${{ github.event.inputs.profil }}
          SAYI: ${{ github.event.inputs.sayi }}
        run: python3 manus_besle.py
      - name: Ciktilari commit et
        if: always()
        run: |
          git config user.name "manus-bot"
          git config user.email "manus-bot@users.noreply.github.com"
          git add senaryolar.json manus_durum.json manus_rapor.md \
                  manus_strateji.md manus_rakip.md 2>/dev/null || true
          git commit -m "manus: ${{ github.event.inputs.mod }} ciktisi" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz"; sleep $((2 ** i))
          done
          echo "push atlandi"; exit 0
