name: Ses A/B Testi (YUKLEMEZ)
# Elle. Ayni cumleyi mevcut + farkli ElevenLabs sesleriyle uretip TEK
# karsilastirma videosu yapar. YouTube secret'i YOK -> kanala DOKUNMAZ.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sestest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: FFmpeg + fontlar
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Ses karsilastirma videosu uret
        env:
          # YT secret'lari BILEREK yok -> yukleme imkansiz.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
        run: python3 ses_test.py
      - name: Videoyu artifact yap
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ses-test
          path: output/ses_test.mp4
          if-no-files-found: warn
          retention-days: 7
      - name: Videoyu dala yayinla (dogrudan gosterim)
        if: always()
        run: |
          test -f output/ses_test.mp4 || exit 0
          cp output/ses_test.mp4 /tmp/ses_test.mp4
          git config user.name "ses-bot"
          git config user.email "ses-bot@users.noreply.github.com"
          git checkout --orphan ses_test_tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/ses_test.mp4 ses_test.mp4
          git add ses_test.mp4
          git commit -m "ses test videosu" || exit 0
          git push -f origin ses_test_tmp:ses-test-video || echo "push atlandi"
