name: YouTube Yayin Bekcisi

# Günlük iki ana cron zaten sabit; ek bekçi tetikleri slot çakışmasına yol
# açmaması için kapalıdır.
on: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: youtube-yayin-bekcisi
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Yayin slotunu kontrol et
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "$(date -u +%H)" -lt 12 ]; then
            export SLOT_UTC="09:00"
          else
            export SLOT_UTC="17:00"
          fi
          python3 yayin_bekcisi.py
