name: Tensor.Art Gorsel Test

# ELLE tetiklenen test: TENSOR_* secret'lariyla tek bir AI gorsel uretir ve
# artifact olarak yukler. Gunluk kanal akisina (otomasyon/uzun) DOKUNMAZ.
# Auth: imza tabanli (RSA/SHA256) — tensor_gorsel.py.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Gorsel prompt'u (Ingilizce en iyi sonucu verir)"
        required: false
        default: "a cinematic wide shot of a mysterious deep ocean, dramatic lighting, 4k"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Tensor.Art gorsel uret
        env:
          TENSOR_APP_ID: ${{ secrets.TENSOR_APP_ID }}
          TENSOR_PRIVATE_KEY: ${{ secrets.TENSOR_PRIVATE_KEY }}
          TENSOR_BASE_URL: ${{ secrets.TENSOR_BASE_URL }}
          TENSOR_MODEL_ID: ${{ secrets.TENSOR_MODEL_ID }}
          PROMPT: ${{ github.event.inputs.prompt }}
          CIKTI: "output/tensor_test.jpg"
        run: python3 tensor_gorsel.py
      - name: Gorseli artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tensor-gorsel
          path: output/tensor_test.jpg
          if-no-files-found: ignore
          retention-days: 14
