name: Tensor Gorsel Testi

# aitools_id (AITool workflow template) önceliklidir. dry_run=true iken sadece
# alan şeması çekilir (kredi harcanmaz), araç tipini görmek için.
on:
  workflow_dispatch:
    inputs:
      aitools_id:
        description: "AITool template ID (tensor.art/template/<ID>)"
        required: false
        default: "845429123819050179"
      prompt:
        description: "Görsel prompt'u (İngilizce)"
        required: false
        default: "underwater ancient ruins of a lost city, cinematic, dramatic god rays, photorealistic"
      dry_run:
        description: "true = sadece alan şeması (kredi harcamaz); false = gerçek üretim"
        required: false
        default: "true"
      model_id:
        description: "(opsiyonel) doğrudan model — aitools_id boşsa"
        required: false
        default: ""
      width:
        required: false
        default: "1024"
      height:
        required: false
        default: "576"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tensor gorsel uret
        env:
          TENSOR_API_KEY: ${{ secrets.TENSOR_API_KEY }}
          AITOOLS_ID: ${{ github.event.inputs.aitools_id }}
          PROMPT: ${{ github.event.inputs.prompt }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MODEL_ID: ${{ github.event.inputs.model_id }}
          WIDTH: ${{ github.event.inputs.width }}
          HEIGHT: ${{ github.event.inputs.height }}
        run: python3 tensor_gorsel.py
      - name: Gorseli kaydet
        if: always()
        run: |
          git config user.name "tensor-bot"
          git config user.email "tensor-bot@users.noreply.github.com"
          git add output/tensor_test.jpg || true
          git commit -m "tensor test gorseli" || echo "degisiklik yok"
          git push || echo "push atlandi"
