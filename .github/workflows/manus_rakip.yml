name: Manus RAKIP Analizi (tek tik)

# TEK TIK: hicbir secim yapmadan calisir. manus.yml'deki "Is kolu" menusu
# varsayilan olarak ping geldigi icin yanlislikla test kosusu yapiliyordu;
# bu dosya yalnizca rakip analizini calistirir, secilecek bir sey yoktur.
# Cikti: manus_rakip.md (repoya commit edilir). Tahmini maliyet ~250 kredi.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kisa-video
  cancel-in-progress: false

jobs:
  rakip:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # arastirma gorevi dakikalar surebilir
    steps:
      - uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Rakip analizi
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          MOD: rakip
          PROFIL: lite
        run: python3 manus_besle.py
      - name: Raporu commit et
        if: always()
        run: |
          git config user.name "manus-bot"
          git config user.email "manus-bot@users.noreply.github.com"
          for f in manus_rakip.md manus_durum.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git commit -m "manus: rakip analizi" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz"; sleep $((2 ** i))
          done
          echo "push atlandi"; exit 0
