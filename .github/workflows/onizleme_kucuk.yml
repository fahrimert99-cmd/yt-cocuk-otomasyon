name: Onizleme Kucuk Video (gecici)

# Biten bir önizleme koşusunun videosundan 480p kopya üretip bu dala kaydeder
# (sohbette doğrudan izlemek için). Yeniden üretim yapmaz, kredi harcamaz.
on:
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [onizleme/uzun/kucuk_tetik.txt]

permissions:
  contents: write
  actions: read

jobs:
  kucuk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: k
        run: echo "id=$(head -1 onizleme/uzun/kucuk_tetik.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: uzun-onizleme
          run-id: ${{ steps.k.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: indirilen
      - name: 480p kopya + kapak/kareler
        run: |
          sudo apt-get -o Acquire::Retries=3 update >/dev/null || true
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg >/dev/null
          v=$(find indirilen -name video.mp4 | head -1)
          mkdir -p onizleme/uzun
          ffmpeg -v error -y -i "$v" -vf scale=-2:480 -c:v libx264 -preset veryfast -crf 30 \
            -c:a aac -b:a 96k -movflags +faststart onizleme/uzun/video_480p.mp4
          for f in kapak.jpg kareler.jpg aciklama.txt senaryo.json uzun_onizleme.log; do
            p=$(find indirilen -name "$f" | head -1); [ -n "$p" ] && cp "$p" onizleme/uzun/
          done
          ls -la onizleme/uzun
      - name: Dala kaydet
        run: |
          git config user.name "onizleme-bot"
          git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/uzun
          git commit -m "onizleme: 480p video + paket (run ${{ steps.k.outputs.id }})" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin claude/adoring-sagan-ni2qvl && git push origin HEAD:claude/adoring-sagan-ni2qvl && exit 0
            sleep $((2 ** i))
          done
