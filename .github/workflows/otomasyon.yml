name: Gunluk Bilim Videosu

on:
  schedule:
    # PLANLI YAYIN: cron videoyu SLOTTAN ÖNCE üretir; video 'private + publishAt'
    # ile yüklenip Studio'da "Planlanan"a düşer ve tam yayın saatinde
    # (config.yayin_saatleri_utc = 09:00 & 17:00 UTC = 12:00 & 20:00 TR) otomatik
    # public olur. Erken üretim + yedek cron'lar, GitHub gecikmesine karşı tampon.
    #
    # Ana üretim (erken):
    - cron: "0 0 * * *"     # 03:00 TR → 12:00 TR yayını (09:00 UTC); ~9 saat tampon
    - cron: "0 10 * * *"    # 13:00 TR → 20:00 TR yayını (17:00 UTC); ~7 saat tampon
    # Yedek üretim (slot doluysa otomasyon.py otomatik çıkar, çift video yok):
    - cron: "30 5 * * *"    # 08:30 TR → 12:00 slotu hâlâ boşsa doldur
    - cron: "30 13 * * *"   # 16:30 TR → 20:00 slotu hâlâ boşsa doldur
    # Son çare (slot saati geçtiyse 4s tolerans → anında public):
    - cron: "20 9 * * *"    # 12:20 TR → 12:00 kaçtıysa hemen public video üret
    - cron: "20 17 * * *"   # 20:20 TR → 20:00 kaçtıysa hemen public video üret
  workflow_dispatch:        # Elle "Run workflow" butonu (acil / kaçırılan yayın için)

permissions:
  contents: write

# Ayni anda birden fazla calisma durum.json'i bozmasin
concurrency:
  group: kisa-video
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Video uret ve yukle
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 otomasyon.py
      # Uretilen video/kapak repoya commit edilmez; buradan indirilebilir.
      - name: Video artifact (son_video.mp4 / son_kapak.jpg)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: son-video
          path: |
            son_video.mp4
            son_kapak.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Sirayi kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add durum.json || true
          git commit -m "sonraki" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz, bekleniyor..."; sleep $((2 ** i))
          done
          echo "push 5 denemede basarisiz — durum.json bir sonraki calismada tekrar denenir"
          exit 0
