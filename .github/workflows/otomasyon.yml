name: Gunluk Bilim Videosu

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Ayni anda birden fazla calisma durum.json'i bozmasin (uzun.yml ile ayni desen)
concurrency:
  group: kisa-video
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Video uret ve yukle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 otomasyon.py
      # Uretilen video/kapak repoya commit edilmez; buradan indirilebilir.
      - name: Video artifact (son_video.mp4 / son_kapak.jpg)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: son-video
          path: |
            son_video.mp4
            son_kapak.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Sirayi kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add durum.json || true
          git commit -m "sonraki" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz, bekleniyor..."; sleep $((2 ** i))
          done
          echo "push 5 denemede basarisiz — durum.json bir sonraki calismada tekrar denenir"
          exit 0
