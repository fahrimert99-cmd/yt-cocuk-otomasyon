name: Gunluk Bilim Videosu

on:
  schedule:
    # PLANLI YAYIN: cron videoyu SLOTTAN ~2 saat ÖNCE üretir; video 'private +
    # publishAt' ile yüklenip Studio'da "Planlanan"a düşer ve tam yayın saatinde
    # (config.yayin_saatleri_utc = 09:00 & 17:00 UTC = 12:00 & 20:00 TR) otomatik
    # public olur. Erken üretim, GitHub cron'unun gecikmesine karşı tampon sağlar.
    # concurrency grubu çakışmayı serialize eder.
    - cron: "0 7 * * *"    # üretim -> 12:00 TR yayını (09:00 UTC publishAt)
    - cron: "0 15 * * *"   # üretim -> 20:00 TR yayını (17:00 UTC publishAt)
  # GARANTİLİ TETİK: GitHub'ın kendi cron'u gecikebilir/atlayabilir; dıştan bir
  # zamanlayıcı (ör. cron-job.org) repository_dispatch ile bunu tetikler.
  repository_dispatch:
    types: [uret-short]
  workflow_dispatch:

permissions:
  contents: write

# Ayni anda birden fazla calisma durum.json'i bozmasin (uzun.yml ile ayni desen)
concurrency:
  group: kisa-video
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Video uret ve yukle
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 otomasyon.py
      # Uretilen video/kapak repoya commit edilmez; buradan indirilebilir.
      - name: Video artifact (son_video.mp4 / son_kapak.jpg)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: son-video
          path: |
            son_video.mp4
            son_kapak.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Sirayi kaydet
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add durum.json || true
          git commit -m "sonraki" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz, bekleniyor..."; sleep $((2 ** i))
          done
          echo "push 5 denemede basarisiz — durum.json bir sonraki calismada tekrar denenir"
          exit 0
