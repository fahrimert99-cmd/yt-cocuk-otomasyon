name: Gemini API Test (YouTube yok)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Test edilecek Gemini görsel modeli"
        required: false
        default: "gemini-2.5-flash-image"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gemini API testini çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEST_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash-image' }}
        run: python3 gemini_api_test.py
      - name: Test görselini artifact yap
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gemini-test-image
          path: gemini-test.jpg
          if-no-files-found: ignore
          retention-days: 7
