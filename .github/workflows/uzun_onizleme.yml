name: Uzun Video ONIZLEME (YUKLEMEZ)

# Uzun tüketici belgeselini TAM üretir (senaryo + AI görseller + ElevenLabs ses +
# kapak + zaman damgaları) ama YouTube'a YÜKLEMEZ: YouTube secret'ları BİLEREK
# verilmez. Video "uzun-onizleme" artifact'ında; kapak, kare paneli, açıklama ve
# senaryo ayrıca onizleme/uzun/ klasörüne commit edilir.
# Tetikleme: Actions'tan elle ya da onizleme_tetik.txt değişince (bu dal).
# Commit mesajında [yeniden] varsa: onaylı önizlemenin senaryosu, sesi ve kapağı
# yeniden kullanılır, yalnızca görseller yeniden üretilir (TTS/ElevenLabs YOK).
# [yeni-ses]: senaryo + kapak yeniden kullanılır, ses config'e göre sıfırdan üretilir.
# Commit mesajında [durdur] varsa: çalışan önizleme iptal edilir.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [onizleme_tetik.txt]

permissions:
  contents: write
  actions: read   # önceki önizlemenin artifact'ından hazır sesi almak için

concurrency:
  group: uzun-onizleme
  cancel-in-progress: true   # yeni önizleme, takılı/eski önizlemeyi iptal eder

jobs:
  onizle:
    # commit mesajında [durdur] varsa: bu koşu çalışan önizlemeyi iptal eder, kendisi atlanır
    if: ${{ !contains(github.event.head_commit.message, '[durdur]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        # Paket aynası yanıt vermezse (bir koşu 7+ dk asılı kaldı) sonsuza dek bekleme.
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $APT update || true
          sudo apt-get $APT install -y --no-install-recommends ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Hazir ses — onbellek (ayni senaryo)
        id: sesonbellek
        if: contains(github.event.head_commit.message, '[yeniden]')
        uses: actions/cache/restore@v4
        with:
          path: output/ses_cache
          key: uzun-ses2-${{ hashFiles('onizleme/uzun/senaryo.json') }}
      - name: Hazir ses — onceki onizleme kaynak run
        id: kaynak
        if: contains(github.event.head_commit.message, '[yeniden]') && steps.sesonbellek.outputs.cache-hit != 'true'
        run: echo "id=$(cat onizleme/uzun/kaynak_run.txt)" >> "$GITHUB_OUTPUT"
      - name: Hazir ses — onceki onizleme videosunu indir
        if: steps.kaynak.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          name: uzun-onizleme
          run-id: ${{ steps.kaynak.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: onceki
      - name: Hazir ses — videodan anlatimi cikar
        if: steps.kaynak.outputs.id != ''
        run: |
          v=$(find onceki -name video.mp4 | head -1)
          ffmpeg -v error -y -i "$v" -vn -c:a libmp3lame -q:a 2 /tmp/onceki_ses.mp3
          ls -la /tmp/onceki_ses.mp3
          echo "ONIZLEME_HAZIR_SES=/tmp/onceki_ses.mp3" >> "$GITHUB_ENV"
      - name: Onizleme uret (YouTube'a YUKLENMEZ)
        env:
          ONIZLEME: "1"
          ONIZLEME_YENIDEN: ${{ contains(github.event.head_commit.message, '[yeniden]') && '1' || '0' }}
          ONIZLEME_YENI_SES: ${{ contains(github.event.head_commit.message, '[yeni-ses]') && '1' || '0' }}
          # YT secret'lari BILEREK yok -> yukleme imkansiz.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_UZUN: ${{ secrets.GEMINI_KEY_UZUN }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}  # görsel: faturalı ayrı proje
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}      # Cloudflare Workers AI görsel
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
        run: |
          set -o pipefail
          python3 uzun_otomasyon.py 2>&1 | sed -E 's/anahtar:.*/anahtar: [redacted]/' | tee uzun_onizleme.log
      - name: Temiz anlatimi onbellege kaydet (ayni senaryo bir daha seslendirilmez)
        if: always() && hashFiles('output/ses_cache/zaman.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: output/ses_cache
          key: uzun-ses2-${{ hashFiles('output/onizleme/senaryo.json') }}
      - name: Onizleme artifact (video dahil)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uzun-onizleme
          path: |
            output/onizleme/
            uzun_onizleme.log
          if-no-files-found: warn
          retention-days: 14
      - name: Kucuk dosyalari dala kaydet (video haric)
        if: always()
        run: |
          mkdir -p onizleme/uzun
          for f in kapak.jpg kapak_bg.jpg kareler.jpg aciklama.txt senaryo.json; do
            [ -f "output/onizleme/$f" ] && cp "output/onizleme/$f" onizleme/uzun/
          done
          cp uzun_onizleme.log onizleme/uzun/ 2>/dev/null || true
          # sohbette doğrudan izlenebilsin diye küçük (480p) kopya
          if [ -f output/onizleme/video.mp4 ]; then
            ffmpeg -v error -y -i output/onizleme/video.mp4 -vf scale=-2:480 -c:v libx264 -preset veryfast \
              -crf 30 -c:a aac -b:a 96k -movflags +faststart onizleme/uzun/video_480p.mp4 || true
            ls -la onizleme/uzun/video_480p.mp4 || true
          fi
          # sonraki [yeniden] koşusu hazır sesi bu koşunun videosundan alabilsin
          [ -f output/onizleme/video.mp4 ] && echo "${{ github.run_id }}" > onizleme/uzun/kaynak_run.txt
          git config user.name "onizleme-bot"
          git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/uzun   # .gitignore *.jpg/*.log engelini aş (yalnız bu klasör)
          git commit -m "onizleme: uzun video paketi" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin claude/adoring-sagan-ni2qvl && git push origin HEAD:claude/adoring-sagan-ni2qvl && exit 0
            sleep $((2 ** i))
          done
