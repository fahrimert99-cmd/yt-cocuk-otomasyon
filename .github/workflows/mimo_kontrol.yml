name: MiMo Deneme (YUKLEMEZ)
# Sadece elle. Xiaomi MiMo API'sini dener: model listesi, ornek senaryo, SEO,
# gorsel ve video anlama. Kanala ve senaryolar.json'a DOKUNMAZ.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q Pillow
      - name: MiMo deneme raporu
        env:
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: python3 mimo_kontrol.py
      - name: Rapor artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mimo-rapor
          path: |
            output/mimo_rapor.txt
            output/mimo_modeller.txt
            output/mimo_ornek_senaryo.json
          if-no-files-found: warn
          retention-days: 7
      # Raporu 'mimo-rapor' dalina yayinla -> asistan cekip dogrudan okuyabilsin.
      - name: Raporu dala yayinla
        if: always()
        run: |
          test -f output/mimo_rapor.txt || exit 0
          mkdir -p /tmp/mimo && cp output/mimo_* /tmp/mimo/ 2>/dev/null || true
          git config user.name "mimo-bot"
          git config user.email "mimo-bot@users.noreply.github.com"
          git checkout --orphan mimo_rapor_tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/mimo/* .
          git add mimo_*
          git commit -m "mimo deneme raporu" || exit 0
          git push -f origin mimo_rapor_tmp:mimo-rapor || echo "push atlandi"
