name: Gunluk Denetim (Analiz)

# Her gün YouTube istatistiklerini çeker ve rapor'u (analiz_rapor.md/.json)
# repoya yazar. Performans verisi elle gönderilmeden kendiliğinden birikir.
on:
  schedule:
    - cron: "0 6 * * *"   # her gün 06:00 UTC (09:00 TR)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Analiz + rapor
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 analiz.py
      - name: Raporu kaydet
        if: always()
        run: |
          git config user.name "analiz-bot"
          git config user.email "analiz-bot@users.noreply.github.com"
          git add analiz_rapor.md analiz_rapor.json || true
          git commit -m "denetim: gunluk rapor" || echo "degisiklik yok"
          git push || echo "push atlandi"
