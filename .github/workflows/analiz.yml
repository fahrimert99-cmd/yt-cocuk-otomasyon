name: Gunluk Denetim (Analiz)

# Her gün YouTube istatistiklerini çeker ve rapor'u (analiz_rapor.md/.json)
# repoya yazar. Performans verisi elle gönderilmeden kendiliğinden birikir.
on:
  schedule:
    - cron: "0 6 * * *"   # her gün 06:00 UTC (09:00 TR)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Analiz + rapor
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python3 analiz.py
      - name: Raporu kaydet
        if: always()
        run: |
          git config user.name "analiz-bot"
          git config user.email "analiz-bot@users.noreply.github.com"
          git add analiz_rapor.md analiz_rapor.json || true
          git commit -m "denetim: gunluk rapor" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz, bekleniyor..."; sleep $((2 ** i))
          done
          echo "push atlandi (5 deneme)"; exit 0
