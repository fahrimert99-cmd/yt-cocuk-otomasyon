name: Uzun Video (Otonom)
# Uzun videolar: GİZEM/GERÇEK OLAYLAR, ~3 dk. Haftada 2 kez otonom üretim.
# NOT: config.json'da "uzun_gizlilik":"unlisted" olduğu sürece videolar
# gizli (link ile) yüklenir — kanalda herkese açık olmaz. Kaliteyi onaylayınca
# "private" (zamanlanmış public) yapın.
on:
  # Zamanlanmış üretim DURDURULDU (analiz: uzun ort. 38 izlenme vs short 750).
  # Yeniden açmak için aşağıdaki schedule'ı geri ekleyin ve config.json'da
  # "uzun_aktif": true yapın. Manuel çalıştırma workflow_dispatch ile mümkün.
  # schedule:
  #   - cron: "0 8 * * 2,6"   # Salı ve Cumartesi 08:00 UTC — haftada 2 uzun video
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: uzun-video
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Uzun video uret ve yukle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_UZUN: ${{ secrets.GEMINI_KEY_UZUN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 uzun_otomasyon.py 2>&1 | sed -E 's/anahtar:.*/anahtar: [redacted]/' | tee uzun_run.log
      - name: Run log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uzun-run-log
          path: uzun_run.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Durum kaydet
        if: always()
        run: |
          git config user.name "uzun-bot"
          git config user.email "uzun-bot@users.noreply.github.com"
          git add uzun_durum.json || true
          git commit -m "uzun: durum" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz, bekleniyor..."; sleep $((2 ** i))
          done
          echo "push atlandi (5 deneme)"; exit 0
