name: Uzun Video (Otonom)
# NOT: Uzun videolara GEÇİCİ ARA verildi — önce Shorts'tan büyümek için.
# Otonom zamanlama (cron) kapatıldı; sadece elle (workflow_dispatch) çalışır.
# Tekrar başlatmak için aşağıdaki 'schedule' bloğunu geri ekle.
on:
  # schedule:
  #   - cron: "0 8 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: uzun-video
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Uzun video uret ve yukle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_UZUN: ${{ secrets.GEMINI_KEY_UZUN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 uzun_otomasyon.py 2>&1 | sed -E 's/anahtar:.*/anahtar: [redacted]/' | tee uzun_run.log
      - name: Log + durum kaydet
        if: always()
        run: |
          git config user.name "uzun-bot"
          git config user.email "uzun-bot@users.noreply.github.com"
          git add uzun_durum.json uzun_run.log || true
          git commit -m "uzun: run log" || echo "degisiklik yok"
          git push || echo "push atlandi"
