name: Uzun Video (Otonom)
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: uzun-video
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Uzun video uret ve yukle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 uzun_otomasyon.py
      - name: Uzun durumu kaydet (sadece uzun_durum.json)
        run: |
          git config user.name "uzun-bot"
          git config user.email "uzun-bot@users.noreply.github.com"
          git add uzun_durum.json || true
          git commit -m "uzun: sirayi ilerlet" || echo "degisiklik yok"
          git push || echo "push atlandi"
