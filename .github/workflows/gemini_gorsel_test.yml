name: Gemini Gorsel Testi (gecici)

# Hangi Gemini anahtarıyla hangi görsel modelinin çalıştığını test eder.
# Sonuç (rapor + örnek görseller) onizleme/gemini_test/ altına kaydedilir.
on:
  push:
    branches: [claude/adoring-sagan-ni2qvl]
    paths: [.github/workflows/gemini_gorsel_test.yml, gemini_gorsel_test.py]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY_UZUN: ${{ secrets.GEMINI_KEY_UZUN }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
        run: python3 gemini_gorsel_test.py
      - name: Dala kaydet
        if: always()
        run: |
          git config user.name "onizleme-bot"
          git config user.email "onizleme-bot@users.noreply.github.com"
          git add -f onizleme/gemini_test
          git commit -m "test: Gemini görsel sonuçları" || exit 0
          git push origin HEAD:claude/adoring-sagan-ni2qvl
