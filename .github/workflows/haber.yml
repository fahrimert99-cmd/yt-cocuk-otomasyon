name: Guncel Tuketici Haberi (Short)
# Haftada 2 kez (Pzt & Perş) guncel tuketici haberi -> kanal tarzi Short.
# haber.py RSS'ten uygun+taze haberi secip senaryo yazar; uygun haber yoksa
# video URETILMEZ. Uretim/yukleme mevcut uret_dispatch.py ile yapilir
# (SEO aciklama + markali ilk kare + oynatma listesi dahil).
on:
  schedule:
    - cron: "0 11 * * 1,4"   # Pazartesi & Perşembe 14:00 TR
  # GARANTİLİ TETİK: dıştan zamanlayıcı (cron-job.org) repository_dispatch ile.
  repository_dispatch:
    types: [uret-haber]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: kisa-video          # otomasyon.yml ile ayni grup -> durum cakismasi yok
  cancel-in-progress: false
jobs:
  haber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Haber sec ve senaryo yaz
        run: python3 haber.py 2>&1 | tee haber_run.log
      - name: Uygun haber varsa video uret ve yukle
        env:
          DIKEY: "evet"
          SENARYO_DOSYA: output/haber_senaryo.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -f output/haber_senaryo.json ]; then
            python3 uret_dispatch.py
          else
            echo "Uygun haber yok — bu turda video üretilmedi."
          fi
      - name: Durum kaydet (dedup icin)
        if: always()
        run: |
          git config user.name "haber-bot"
          git config user.email "haber-bot@users.noreply.github.com"
          git add haber_durum.json || true
          git commit -m "haber: durum" || { echo "degisiklik yok"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "push tamam (deneme $i)"; exit 0
            fi
            echo "push denemesi $i basarisiz"; sleep $((2 ** i))
          done
          echo "push atlandi"; exit 0
